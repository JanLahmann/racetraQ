# 8-qubit profile: 7 lidar rays + speed = 8 features, one per qubit.
# Bundled weights (quantum_<track>_q8.npz): oval and chicane; on other tracks
# attract/race/evolution/hardware stay unavailable until you train.
# 5 re-uploading blocks: at 8 qubits the default 4 hide one feature from every
# action (Brake cannot see speed); 5 give every action the full observation and
# train more reliably (October 2026 study, 6 seeds per depth) —
# python -m traqmania.agents.quantum.lightcone --qubits 8 --layers 4

[circuit]
n_qubits = 8
n_layers = 5

[observation]
ray_angles_deg = [-60.0, -40.0, -20.0, 0.0, 20.0, 40.0, 60.0]
# Engineered-feature alternative: 3 rays + speed + all four track-aware
# inputs (still 8 features).  Uncomment all the lines below to activate:
# ray_angles_deg = [-60.0, 0.0, 60.0]
# features = ["rays", "speed", "curvature_ahead", "lateral_offset",
#             "heading_error", "corner_speed_ratio"]
