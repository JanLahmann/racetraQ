# traQmania default configuration.
# Profiles (pi4.toml, pi5.toml, exhibition.toml) overlay onto this file.

[physics]
dt = 0.016666667          # 60 Hz substep
substeps_per_decision = 6 # -> 10 Hz agent decisions, action held between decisions
# "v2" speed-variation physics (2026-07-11): faster straights, same hairpin
# discipline — hero max/min speed ratio ~1.8 on gp/combo (was ~1.5). The
# strongest variant the 4-qubit circuit still learns: v_max 28-30 proved
# unlearnable on gp/combo even warm-started. All bundled weights are trained
# under these constants; changing them invalidates every .npz in weights/.
accel = 11.0              # units/s^2 at full throttle (v1: 9.0)
brake = 16.0              # (v1: 14.0)
drag = 0.35
v_max = 25.0              # (v1: 22.0)
v_turn = 9.0              # speed of peak steering authority
k_steer = 2.6             # rad/s steering rate at peak authority

[observation]
ray_angles_deg = [-60.0, 0.0, 60.0]
ray_max_dist = 30.0       # normalization length for lidar rays
# Observation feature kinds, concatenated in order; every scalar lands in [0, 1]
# and the total (rays = one per ray angle, the rest one each) must equal
# [circuit] n_qubits.  Kinds: "rays", "speed", "curvature_ahead",
# "lateral_offset", "heading_error", "corner_speed_ratio".
features = ["rays", "speed"]
lookahead_m = 15.0        # arc-length window for curvature_ahead / corner_speed_ratio

[reward]
progress_scale = 1.0      # reward per unit of centerline arc-length gained
offtrack_penalty = 10.0
lap_bonus = 50.0
checkpoint_bonus = 5.0
max_decisions = 600       # episode cap (60 s at 10 Hz)

[track]
default = "oval"
resample_spacing = 1.5

[circuit]
n_qubits = 4
n_layers = 4              # data re-uploading blocks
seed = 7
# n_actions = 6           # scaled action readout: Q_a = <Z_a> on the first
#                         # n_actions qubits (4 | 6 | 8; default min(4, n_qubits)).
#                         # 6 adds trail braking, 8 adds half-steer — see
#                         # traqmania/agents/base.py. Weights record their action
#                         # count in the .meta.json sidecar; the server adopts it
#                         # per driver, so leave this unset in profiles.

[training]
algo = "double_dqn"
backend = "fastsim"       # fastsim | aer_statevector | aer_shots | aer_noisy
episodes = 400
replay_size = 10000
batch_size = 32
gamma = 0.98
lr = 0.01
target_sync_every = 200   # updates
epsilon_start = 1.0
epsilon_end = 0.05
epsilon_decay_episodes = 250
n_parallel_envs = 8
seed = 42
warm_start = false
# The 60 s time limit is a truncation, not a terminal state: the TD target keeps
# bootstrapping there (Pardo et al., ICML 2018). On since the October 2026 study
# (neutral to positive on every track; false restores the pre-audit behaviour).
bootstrap_truncation = true
# Optional trainer knobs (agents/training/dqn.py). Each line shows the default,
# which is the behaviour without it; uncomment to change.
# eval_every = 50               # greedy snapshot eval every N episodes
# eval_episodes = 12            # distinct greedy episodes per eval (parallel eval envs)
# loss = "mse"                  # "mse" | "huber" (TD error clipped to +-huber_delta in the gradient)
# huber_delta = 10.0            # Huber threshold in Q units (Q-values here are of order 100)
# lr_groups = { head = 0.01 }   # per-group learning rates; quantum: lam | theta | head, mlp: body | head; unlisted groups use lr
# lr_end = 0.01                 # linear lr anneal from lr to lr_end over the run's episodes (scales every group alike)
# target_update = "hard"        # "hard": copy every target_sync_every updates | "soft": Polyak averaging every update
# tau = 0.005                   # soft target rate: target <- (1 - tau) * target + tau * online
# grad_clip = 0.0               # > 0: clip the gradient's global L2 norm to this value
# reward_scale = 1.0            # multiplies rewards as stored in replay only (reported returns stay unscaled)
# Hardware robustness (quantum agent; default off). act_noise: rollouts and snapshot evals pick actions from NOISY readout
# expectations, <Z> -> attenuation * <Z> + bias + shot noise of `shots` shots (attenuation / bias: one number or one per readout);
# TD targets and gradients stay exact, and the saved snapshot is the one that drives best under the noise.
# `python -m traqmania.agents.quantum.noise calibrate --fake fake_miami` fits the attenuation of a device.
# act_noise = { attenuation = 0.95, shots = 1024 }
# action_gap = 0.0              # in [0, 1): advantage learning (Bellemare et al., AAAI 2016) — the TD target loses action_gap * (max_a Q(s, a) - Q(s, a_taken)), which widens the gap between the best action and the rest by 1 / (1 - action_gap) and leaves the best action unchanged

# Per-track overrides merged onto [training] by the server and by train_headless
# (config.resolve_training_cfg; train_headless --preset none skips them).
# oval/chicane train fine with the base settings and need no preset.
# gp: slow 2000-episode epsilon decay keeps exploration alive long enough to
# learn braking for the hairpin (July 2026 sweep).
[training_presets.gp]
episodes = 3000
epsilon_decay_episodes = 2000
gamma = 0.99

# combo has a gp-style hairpin plus a chicane: same long-haul recipe as gp.
[training_presets.combo]
episodes = 2500
epsilon_decay_episodes = 1500
gamma = 0.99

# Quantum-only layer on top of the presets above (resolve_training_cfg merges
# [training_presets_<agent>.<track>] last). From the October 2026 multi-seed
# studies (tools/study.py):
# - oval / chicane: advantage learning + noisy acting. Trained this way the
#   4- and 6-qubit drivers keep lapping under device noise, and they are at
#   least as stable on the exact simulator (chicane stability 0.63 vs 0.47).
# - gp / combo: a 0.30 exploration floor. With the usual 0.05 the 4-qubit
#   circuit's greedy driving peaks while it is still exploring and collapses
#   afterwards; at 0.30 it stays flat (stability 0.18 vs 0.08, 10 seeds).
#   The MLP wants the opposite (it stops learning gp at 0.30), hence per agent;
#   so does the 10-qubit feature-observation circuit (see docs/SCIENCE.md).
[training_presets_quantum.oval]
action_gap = 0.8
act_noise = { attenuation = 0.95, shots = 1024 }

[training_presets_quantum.chicane]
action_gap = 0.8
act_noise = { attenuation = 0.95, shots = 1024 }

[training_presets_quantum.gp]
epsilon_end = 0.30

[training_presets_quantum.combo]
epsilon_end = 0.30

# Warm-start recipe: short fine-tune on top of the bundled warm-start
# checkpoints (quantum_<track>_warmstart[_q<n>].npz: a snapshot of the bundled
# driver's own training run that does not lap yet, tools/make_stages.py).
# Merged on top of the track's presets, so oval / chicane warm training
# keeps the action-gap / acting-noise recipe of the quantum presets above.
# Measured October 2026 through the server's own warm path, 6 seeds per track
# (42, the one the demo runs, and 0-4); "first lap" = the first lap one of
# the 8 training cars completes, in episodes and CPU seconds of training:
#   oval              6/6 seeds, episode 15-36 (median 20.5), 1.4-2.9 s
#   chicane           6/6 seeds, episode 14-67 (median 47.5), 1.3-5.3 s
#   oval, 6 qubits    6/6 seeds, episode 25-44 (median 29.5), 4.9-7.2 s
#   combo             1/6 seeds (episode 52); the other five never lap
# HONEST caveat: combo does not warm-start reliably. Lower learning rates
# (0.003: 0/3 seeds, 0.001: 1/3) and 400 episodes at 0.003 (0/3) did not
# change that, so the recipe stays as it is.
[training_warm]
epsilon_start = 0.25
epsilon_end = 0.05
epsilon_decay_episodes = 40
episodes = 150

# Pace fine-tune (train_headless --pace, meant with --init on a lapping
# snapshot): low-epsilon phase 2 whose reward adds a per-decision time
# penalty, so the objective becomes "lap FAST", not just "lap". At
# time_penalty 0.5 a lap's net value rises ~5 per second of lap time saved
# (progress reward alone pays the same total per lap however slow it was —
# discounting is otherwise the only pace pressure). Standing still nets
# negative reward below ~5 m/s, which is fine for an already-lapping policy.
[training_pace]
time_penalty = 0.5        # moved to [reward] time_penalty by train_headless
epsilon_start = 0.15
epsilon_end = 0.02
epsilon_decay_episodes = 400
episodes = 600
gamma = 0.99

# gp gets a longer warm fine-tune (merged on top of [training_warm]): a slow
# epsilon decay from the bundled episode-1000 checkpoint.
# HONEST caveat: gp warm live-training mostly fails. Measured October 2026
# like the tracks above (6 seeds): a training car lapped in 1 of 6 seeds
# (seed 0, after 477 episodes, ~42 s CPU), and no run ended with a driver
# that laps in half of its eval episodes; the demo's own seed (42) saw no
# training-car lap. A fast decay to low exploration (epsilon 0.15 -> 0.05
# over 100 episodes) did no better (0 of 3 seeds). In the driver's own
# training run reliable laps came 1200 episodes after this checkpoint — more
# than a warm demo can show. Use oval or chicane to demonstrate warm training.
[training_warm_gp]
epsilon_start = 0.45
epsilon_decay_episodes = 850
episodes = 900
gamma = 0.99

[server]
host = "127.0.0.1"
port = 8000
broadcast_hz = 20
telemetry_hz = 10
# Shared-demo control: the wheel frees after this much driver inactivity, and
# while other visitors wait in line a turn lasts at most driver_turn_s.
driver_idle_s = 90.0
driver_turn_s = 120.0

[ui]
attract_idle_seconds = 45
kiosk = false

[hardware]
backend_name = ""          # real device, e.g. "ibm_fez" (CLI --backend overrides); empty -> least busy available
# Local twin for --fake / the UI's "Simulated device"; any spelling (fake_fez, FakeFez).
# fake_miami / fake_berlin: calibration snapshots of real Nighthawk QPUs — 120-qubit square lattice, the CZ ring embeds with zero SWAPs;
# fake_nighthawk: same lattice with IBM's placeholder error values (works on older qiskit-ibm-runtime, >= 0.44);
# fake_fez / fake_marrakesh / fake_kingston ...: heavy-hex Herons; fake_manila / fake_lagos: retired CX-era Falcons.
fake_name = "fake_miami"
shots = 1024               # shots per Estimator job row: one lap decision, or one replay sample of a sprint's loss evaluation
# decision_shots = 4096    # laps only: shots per decision when the caller names none — the CLI without --shots, a client message without `shots`; the web panel always sends its own shots field (default: shots)
spsa_iterations = 30
# spsa_groups = ["head"]   # parameter groups the SPSA sprint moves, out of "lam" | "theta" | "head" (default: the output head w, b — it can absorb a per-readout device error, and a noisy two-evaluation gradient over all 56 parameters can wreck a driver with thin action gaps in a single step)
# spsa_blocking = true     # take an SPSA step only if the hardware loss at the new parameters is not worse (one more job per iteration); false: take every step
# spsa_guard = 0.9         # refuse an SPSA step (before any job is spent on it) if the driver would keep less than this share of its greedy return on the exact simulator; 0 = no guard
resilience_level = 0       # Estimator error mitigation: 0 raw device noise (honest default) | 1 TREX readout mitigation | 2 TREX + ZNE with gate twirling
prune_light_cone = true    # transpile only the gates inside the readouts' light cone: identical expectation values, fewer two-qubit gates (12 instead of 16 CZ at 4 qubits)
# Attenuation rescale (default off): one extra calibration job before a lap / sprint compares the device with the exact simulator
# on random inputs, then every measured <Z_a> is corrected before the output head: "global" (or true) divides by the one fitted
# attenuation f (<Z>_device ~ f * <Z>_exact, the global-depolarizing picture); "readout" removes each readout's own bias and slope.
# rescale = false          # false | "global" | "readout"
# calibration_samples = 64 # random inputs of the calibration job
# calibration_shots = 8192 # its shots per input (at least; never fewer than the run's own shots)
