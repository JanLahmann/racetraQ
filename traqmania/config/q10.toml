# 10-qubit profile: 9 lidar rays + speed = 10 features, one per qubit.
# Bundled weights (quantum_<track>_q10.npz): oval, chicane and gp (the gp
# driver uses an engineered-feature observation recorded in its sidecar); on
# other tracks attract/race/evolution/hardware stay unavailable until you train.
# n_layers stays at the default 4, which at 10 qubits hides three features
# from every action; full visibility needs 6 blocks —
# python -m traqmania.agents.quantum.lightcone --qubits 10 --layers 4

[circuit]
n_qubits = 10

[observation]
ray_angles_deg = [-60.0, -45.0, -30.0, -15.0, 0.0, 15.0, 30.0, 45.0, 60.0]
# Engineered-feature alternative: 5 rays + speed + all four track-aware
# inputs (still 10 features).  Uncomment all the lines below to activate:
# ray_angles_deg = [-60.0, -30.0, 0.0, 30.0, 60.0]
# features = ["rays", "speed", "curvature_ahead", "lateral_offset",
#             "heading_error", "corner_speed_ratio"]
