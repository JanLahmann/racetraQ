name: Publish container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to (re)build and push, e.g. v0.3.1 (empty: this commit)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write  # cosign keyless OIDC

env:
  IMAGE: ghcr.io/janlahmann/racetraq

jobs:
  build-push-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      # arm64 emulation from Ubuntu's packages: docker/setup-qemu-action pulls
      # tonistiigi/binfmt from Docker Hub anonymously, and the shared runners
      # hit its pull rate limit (the v0.3.1 publish failed on it three times)
      - name: Set up QEMU (Ubuntu packages)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-static binfmt-support
          ls /proc/sys/fs/binfmt_misc/ | grep -q aarch64
      - uses: docker/setup-buildx-action@v3
        with:
          # BuildKit from Google's Docker Hub mirror, for the same reason
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (amd64, load for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:scan

      - name: Trivy scan (gate on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore  # base-image findings, each with its reason there

      - name: Build + push multi-arch
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.release.tag_name || inputs.tag || github.sha }}

      - uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
