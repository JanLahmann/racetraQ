name: Browser edition (GitHub Pages)

# Builds browser/ and publishes it at https://janlahmann.github.io/traQmania/
on:
  push:
    branches: [main]
    paths:
      - "browser/**"
      - "traqmania/web/js/race.js" # imported unchanged by the browser edition
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # npm 11 (Node 24+) cannot prepare the fork git dependency
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: browser/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
