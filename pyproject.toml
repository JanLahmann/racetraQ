[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "racetraq"
version = "0.2.1"
description = "racetraQ — a quantum reinforcement learning racing demo (Qiskit-powered)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Jan Lahmann" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
    "qiskit-machine-learning>=0.9",
]

[project.optional-dependencies]
# 0.47 is the first release with FakeMiami, the default fake backend (a real
# Nighthawk calibration snapshot); 0.50 adds the client-side Estimator, older
# ones fall back to the legacy EstimatorV2.
hardware = ["qiskit-ibm-runtime>=0.47"]
notebooks = ["jupyter", "matplotlib", "pylatexenc"]
dev = ["pytest>=8", "ruff>=0.16,<0.17", "httpx>=0.27", "pytest-asyncio>=0.24"]

[project.scripts]
racetraq = "racetraq.__main__:main"

[tool.setuptools.packages.find]
include = ["racetraq*"]

[tool.setuptools.package-data]
racetraq = [
    "config/*.toml", "env/tracks/*.json", "weights/*.npz", "weights/*.json",
    "data/ghosts/*.json", "data/*.json",
    "web/*.html", "web/css/*.css", "web/js/*.js",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
